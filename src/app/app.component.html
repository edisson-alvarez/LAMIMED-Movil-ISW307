
<ion-app>

  <!-- Diseño adaptable para teléfonos y tablets -->
  <ion-split-pane
    contentId="contenido-principal"
    when="(min-width: 768px)">

    <!-- Menú lateral de LAMIMED -->
    <ion-menu
      contentId="contenido-principal"
      menuId="menu-lamimed"
      type="overlay">

      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>LAMIMED Móvil</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>

        <ion-list>

          <!-- Inicio -->
          <ion-menu-toggle autoHide="false">
            <ion-item
              routerLink="/home"
              routerDirection="root"
              button>
              <ion-icon
                name="home-outline"
                slot="start">
              </ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <!-- Estudios micológicos -->
          <ion-menu-toggle autoHide="false">
            <ion-item
              routerLink="/estudios"
              routerDirection="root"
              button>
              <ion-icon
                name="flask-outline"
                slot="start">
              </ion-icon>
              <ion-label>Estudios micológicos</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <!-- Actualizar estudios -->
          <ion-menu-toggle autoHide="false">
            <ion-item
              routerLink="/actualizar-estudios"
              routerDirection="root"
              button>
              <ion-icon
                name="refresh-outline"
                slot="start">
              </ion-icon>
              <ion-label>Actualizar estudios</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <!-- Pulsación prolongada -->
          <ion-menu-toggle autoHide="false">
            <ion-item
              routerLink="/pulsacion-prolongada"
              routerDirection="root"
              button>
              <ion-icon
                name="finger-print-outline"
                slot="start">
              </ion-icon>
              <ion-label>Pulsación prolongada</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <!-- Zoom de estudios -->
          <ion-menu-toggle autoHide="false">
            <ion-item
              routerLink="/zoom-estudios"
              routerDirection="root"
              button>
              <ion-icon
                name="search-outline"
                slot="start">
              </ion-icon>
              <ion-label>Zoom de estudios</ion-label>
            </ion-item>
          </ion-menu-toggle>

        </ion-list>

      </ion-content>

    </ion-menu>

    <!-- Área donde aparecen las pantallas -->
    <ion-router-outlet
      id="contenido-principal">
    </ion-router-outlet>

  </ion-split-pane>

</ion-app>
